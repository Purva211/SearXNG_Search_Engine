use_default_settings: true

general:
  instance_name: "NEXORA Search"
  contact_url: "https://github.com/Purva211/SearXNG_Search_Engine"

server:
  secret_key: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET"
  limiter: false
  image_proxy: true

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

valkey:
  url: false
  
outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
# ---- Enable JSON output -------------------------------------------------
search:
  formats:
    - json          # <‑‑ this line is required for the front‑end
# ---- Disable bot detection (avoids the X‑Forwarded‑For error) ---------
bot_detection:
  enabled: false    # turn off granian’s bot‑detection module
