use_default_settings: true

general:
  instance_name: "NEXORA Search"
  contact_url: "https://github.com/Purva211/SearXNG_Search_Engine"

server:
  secret_key: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET"
  limiter: false           # keep disabled
  image_proxy: true

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"
  formats:
    - json                # required for the front‑end
    - html                # optional, you can keep it

# ---- ENGINE LIST -------------------------------------------------
# Keep only the engines you actually need. Comment out the rest.
engines:
  - duckduckgo
  - bing
  - google
  - wikipedia
  # - ahmia          # <-- disabled (needs extra package)
  # - torch          # <-- disabled (heavy PyTorch dependency)
  # Add any other engines you want, one per line.

valkey:
  url: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0

bot_detection:
  enabled: false          # turn off Granian’s bot‑detection module
